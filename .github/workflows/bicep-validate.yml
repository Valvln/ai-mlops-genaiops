name: Bicep validate

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: az bicep build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI ships preinstalled on ubuntu-latest runners: only the bicep module is needed.
      - name: Install Bicep CLI
        run: az bicep install

      - name: Show Bicep version
        run: az bicep version

      # Exits with a non-zero code if the template does not compile.
      - name: Build template
        run: az bicep build --file infra/main.bicep
