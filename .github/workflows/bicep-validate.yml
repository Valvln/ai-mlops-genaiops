name: Bicep validate

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: az bicep build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Azure CLI ships preinstalled on ubuntu-latest runners: only the bicep module is needed.
      - name: Install Bicep CLI
        run: az bicep install

      - name: Show Bicep version
        run: az bicep version

      # Every template under infra/, not just main.bicep. Globbing the
      # directory rather than naming files means a template added later is
      # validated without anybody remembering to add it here.
      #
      # The empty-match guard is not defensive padding: a glob that matched
      # nothing would turn this job into a no-op that reports success, which is
      # the same vacuity that let feature 002's SC-003 pass.
      - name: Build every template under infra/
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          for template in infra/**/*.bicep; do
            echo "--- ${template}"
            az bicep build --file "${template}"
            found=$((found + 1))
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::No Bicep template found under infra/ - nothing was validated."
            exit 1
          fi
          echo "${found} template(s) built."
