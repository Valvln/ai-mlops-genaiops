name: OIDC claims probe

# TEMPORARY. Two jobs, two purposes, both of them observations:
#
#   gated    - reads the subject an issued token ACTUALLY carries, so the
#              federated credential is written from what was observed rather
#              than from the documented format. This repository was created
#              after GitHub's immutable-subject cutover (research.md, R3), so
#              the conventional repo:OWNER/REPO:... form would never match.
#
#   ungated  - the same repository, the same branch, no approval gate. Once the
#              federated credential exists this job MUST fail to authenticate.
#              That refusal is SC-004's first, and the sharpest of the three:
#              everything about the run is legitimate except the gate.
#
# Deleted once both have been captured (tasks.md, T040). A workflow that asks
# for a token outside the gate should not outlive its reason for existing.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gated:
    name: Claims from a gated context
    runs-on: ubuntu-latest
    environment: azure-deploy
    steps:
      - name: Print only the sub, aud and iss claims
        env:
          AUDIENCE: api://AzureADTokenExchange
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          echo "::add-mask::${TOKEN}"
          # The token itself is never printed. Three claims are decoded out of
          # it and nothing else leaves this step.
          TOKEN="${TOKEN}" python3 - <<'PY'
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for name in ("sub", "aud", "iss"):
              print(f"{name}: {claims[name]}")
          PY

      # Expected to FAIL on the first run, when no federated credential exists
      # yet, and to SUCCEED afterwards. Both outcomes are informative, so the
      # step does not decide the job.
      - name: Attempt authentication
        continue-on-error: true
        uses: azure/login@858f4093d287a904987dfd22abd163280f939550 # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  ungated:
    name: Claims from an ungated context
    runs-on: ubuntu-latest
    # No `environment:` — that is the whole point of this job.
    steps:
      - name: Print only the sub, aud and iss claims
        env:
          AUDIENCE: api://AzureADTokenExchange
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          echo "::add-mask::${TOKEN}"
          TOKEN="${TOKEN}" python3 - <<'PY'
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for name in ("sub", "aud", "iss"):
              print(f"{name}: {claims[name]}")
          PY

      # MUST fail once the federated credential exists. If this ever succeeds,
      # the trust condition is bound to something wider than the approval gate.
      - name: Attempt authentication without having passed the gate
        continue-on-error: true
        uses: azure/login@858f4093d287a904987dfd22abd163280f939550 # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
